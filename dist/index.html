're verified instantly by a magic link, with full access. Option 2 — College photo ID: upload a photo of your ID card and our team manually reviews it, usually within a few hours and always under 24. Option 3 — Personal email: you get in immediately, but with limited features. The planner tools work, while Community unlocks once you complete verification later. All three are free."},{q:"How does the reputation and title system work?",a:"You earn Q&A points when classmates find your answers helpful — through upvotes and accepted answers. Points unlock titles as you contribute: Newbie at the start, then Helper, Guide, Mentor, and finally Legend. Your title appears next to your name in Q&A, along with a gold verified badge once your college is confirmed. It's a simple way to see who consistently helps on campus."},{q:"Is this a website or a mobile app?",a:"Zemester is a native Android app available on the Google Play Store. There is no web app — everything is designed for your phone, so your timetable, attendance and deadlines are with you between classes. Download it from Play Store, verify your college and you're set up in minutes."},{q:"My college isn't listed. Can I still use Zemester?",a:"Yes. Choose 'Other campus' during setup and add your college, course, semester and timetable manually. It works immediately for you, and once classmates from the same college join and verify, your campus community goes live for everyone there."},{q:"Is my data private and safe?",a:"Yes. Your attendance, marks and tasks are private by default — no other student can see them. In Community, only your name, college and batch are visible, and you control what appears on your profile. College ID photos are used only for verification and are deleted after review, never stored or shared. You can also block or report any user, and our moderation team reviews reports."}];function mj({q:n,a:i,open:l,onToggle:o,index:c}){return h.jsxs("div",{className:me("overflow-hidden rounded-2xl border t
